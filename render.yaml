# =============================================================================
# Render Blueprint Specification for AeroNex (SIH-26078)
# Documentation: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. AeroNex FastAPI Backend REST Service
  # ---------------------------------------------------------------------------
  - type: web
    name: aeronex-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGIN_REGEX
        value: "^https?:\\/\\/(localhost|127\\.0\\.0\\.1|.*\\.onrender\\.com)(:\\d+)?$"
      - key: DATA_PROVENANCE
        value: "DEMO_SYNTHETIC_DATASET"

  # ---------------------------------------------------------------------------
  # 2. AeroNex React Frontend Static Site (Served via global CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: aeronex-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aeronex-api.onrender.com/api
